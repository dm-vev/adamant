<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" role="img" aria-label="Adamant — High-performance Minecraft: Bedrock Edition server in Go">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="gemTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="gemLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="gemRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E293B" stroke-width="0.75"/>
    </pattern>
  </defs>

  <rect width="920" height="220" rx="16" fill="url(#bg)"/>
  <rect width="920" height="220" rx="16" fill="url(#grid)" opacity="0.55"/>
  <rect x="0.75" y="0.75" width="918.5" height="218.5" rx="15.25" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Isometric crystalline voxel emblem -->
  <g transform="translate(68, 46)">
    <polygon points="60,6 112,36 60,66 8,36" fill="url(#gemTop)"/>
    <polygon points="8,36 60,66 60,124 8,94" fill="url(#gemLeft)"/>
    <polygon points="112,36 60,66 60,124 112,94" fill="url(#gemRight)"/>
    <polyline points="60,6 60,66 60,124" fill="none" stroke="#E0F2FE" stroke-opacity="0.45" stroke-width="1.5"/>
    <polyline points="8,36 60,66 112,36" fill="none" stroke="#E0F2FE" stroke-opacity="0.55" stroke-width="1.5"/>
    <polygon points="60,6 112,36 112,94 60,124 8,94 8,36" fill="none" stroke="#67E8F9" stroke-opacity="0.5" stroke-width="1.5"/>
  </g>

  <!-- Title & tagline -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, sans-serif">
    <text x="218" y="84" font-size="44" font-weight="800" letter-spacing="1.5" fill="#F8FAFC">ADAMANT</text>
    <rect x="462" y="56" width="84" height="26" rx="13" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="504" y="74" font-size="12.5" font-weight="700" text-anchor="middle" fill="#6EE7B7">GO 1.27+</text>

    <text x="218" y="118" font-size="15.4" font-weight="500" fill="#CBD5E1">
      Minecraft: Bedrock Edition server built for full Java 26.3 parity &amp; extreme multi-core scale
    </text>

    <rect x="218" y="134" width="640" height="2" rx="1" fill="url(#accent)" opacity="0.7"/>

    <!-- Feature pills -->
    <g transform="translate(218, 152)" font-size="12.5" font-weight="600" fill="#E2E8F0">
      <rect x="0" y="0" width="144" height="28" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="72" y="18.5" text-anchor="middle">Java 26.3 Worldgen</text>

      <rect x="154" y="0" width="144" height="28" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="226" y="18.5" text-anchor="middle">Full Mob AI &amp; Brain</text>

      <rect x="308" y="0" width="166" height="28" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="391" y="18.5" text-anchor="middle">NetherNet &amp; RakNet</text>

      <rect x="484" y="0" width="156" height="28" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="562" y="18.5" text-anchor="middle">Zero-Alloc ECS SDK</text>
    </g>
  </g>
</svg>
