
[Network]
  # The address of the server, including the port. The server will be listening on this address. If another
  # server is already running on this port, please select a different port.
  Address = ":19132"
  # Modern Bedrock uses NetherNet (HTTP signaling and WebRTC). RakNet is available for older/custom clients.
  Transport = "nethernet"
  # Persistent server identity. Keep this private key across restarts and out of version control.
  IdentityFile = "server-key.pem"
  # EnableQuery controls Bedrock Query responses on the RakNet transport.
  # NetherNet does not expose the legacy UDP Query endpoint.
  EnableQuery = false
  # QueryPlugins controls whether plugin metadata is included in the long query response.
  # When disabled, the query `plugins` field only contains the engine label.
  QueryPlugins = false
  # Protocols lists the protocols of Bedrock Edition clients may join with, each by one of its versions:
  # "1.26.50" (or "26.50", "26.51", "26.52", "2193") names protocol 2193, of 1.26.50 to 1.26.52, and
  # "1.26.60" (or "26.60", "26.61", "2225") protocol 2225, of 1.26.60 and 1.26.61. Clients of 1.26.60 see
  # redstone wire, fire and chorus plants unconnected for now.
  Protocols = ["1.26.50"]
  # PrimaryProtocol is the protocol the server speaks, one of Protocols: clients of the others get its packets
  # converted to theirs. This build speaks 1.26.50 alone as its primary.
  PrimaryProtocol = "1.26.50"

[Server]
  # The name as it shows up in the server list. Minecraft colour codes may be used in this name to format the
  # name of the server.
  Name = "Dragonfly Server"
  # AuthEnabled controls whether players must be connected to Xbox Live in order to join the server.
  AuthEnabled = true
  # DisableJoinQuitMessages specifies if join/quit messages should be broadcast when players join the server.
  DisableJoinQuitMessages = false
  # IdentityKey is what the whitelist, the operators, the bans and the data of players are keyed by:
  # "xuid", the Xbox account; "name", the name, which anyone can take without Xbox Live sign-in;
  # "auto", "xuid" if AuthEnabled is true and "name" otherwise.
  IdentityKey = "auto"
  # MuteEmoteChat specifies if the player emote chat should be muted or not.
  MuteEmoteChat = false
  # NameCheck sets how the names of players are checked at login. Valid values: "lenient" (a name passes if any one
  # of its characters is one Bedrock allows, so that §aSteve and Steve! join), "game" (also refuse names with a
  # character other than a letter, a digit, a space or an underscore) or "strict" (refuse names with any character
  # Bedrock does not allow: other than Latin letters, digits and spaces with Xbox Live, letters, digits and spaces
  # without).
  NameCheck = "lenient"
  # ReconnectPolicy controls what happens when the same player joins while already online.
  # Valid values: "kick-joining" (disconnect the new connection) or "kick-existing" (disconnect the existing player).
  ReconnectPolicy = "kick-existing"
  # StrictConfig refuses to start with a key or a table of this file that nothing reads, such as a misspelt one,
  # or with a value the server falls back from. If false, the server warns of them at start and starts.
  StrictConfig = false

[World]
  # The folder that the world files (will) reside in, relative to the working directory. If not currently
  # present, the folder will be made.
  Folder = "world"
  # Seed selects all dimensions' generation seed for a new world. Existing level.dat.RandomSeed takes precedence, including 0.
  Seed = 0
  # Whether the worlds' data will be saved and loaded. If true, the server will use the
  # default LevelDB data provider and if false, an empty provider will be used. To use your
  # own provider, turn this value to false, as you will still be able to pass your own provider.
  SaveData = true
  # How often the worlds and the players in them are saved, all at one instant, as a duration such as "5m"
  # or "90s". /save-all and stopping the server save them too. Set this to "0s" to save only then.
  SaveInterval = "5m"
  # SaveChunks selects which loaded chunks a save or an unload writes to disk. "modified" writes the chunks
  # generated or changed since they were last saved, and those holding entities or block entities. "all"
  # writes every loaded chunk, changed or not, at every save: use it while pregenerating a world.
  SaveChunks = "modified"
  # GeneratorWorkers controls how many background workers are dedicated to generating chunks.
  # Set this to 0 to automatically use the number of logical CPU cores available. Under heavy
  # world generation load you may need to increase both this value and GeneratorQueueSize to avoid
  # backpressure; profile first if chunk generation is bottlenecked by LevelDB or other I/O.
  GeneratorWorkers = 0
  # GeneratorQueueSize limits how many chunk generation jobs may wait for a worker.
  # Set this to 0 to use an automatically chosen size based on the worker count. Increase this together
  # with GeneratorWorkers when large preloads saturate the queue; keep an eye on storage pressure if the
  # generator relies on external services like LevelDB.
  GeneratorQueueSize = 0
  # DisableOverworld disables the overworld dimension entirely. Nether and End portals can still be created but won't teleport entities to it.
  DisableOverworld = false
  # DisableNether disables the Nether dimension entirely. Nether portals can still be created but won't teleport entities.
  DisableNether = false
  # DisableEnd disables the End dimension entirely. End portals can still be created but won't teleport entities.
  DisableEnd = false
  # DefaultDimension selects which dimension players spawn in. Valid values are "overworld", "nether" and "end".
  DefaultDimension = "overworld"
  # PortalDisabledMessage is sent to players that try to enter a portal leading to a disabled dimension.
  # If the string contains a formatting verb such as %s, it will be replaced with the dimension name. Leave empty to disable the message entirely.
  PortalDisabledMessage = "The %s dimension is disabled on this server."

[Players]
  # The maximum amount of players accepted into the server. If set to 0, there is no player limit. The max
  # player count will increase as more players join.
  MaxCount = 0
  # The maximum chunk radius that players may set in their settings. If they try to set it above this number,
  # it will be capped and set to the max.
  MaximumChunkRadius = 32
  # Whether a player's data will be saved and loaded. If true, the server will use the
  # default LevelDB data provider and if false, an empty provider will be used. To use your
  # own provider, turn this value to false, as you will still be able to pass your own provider.
  SaveData = true
  # Folder controls where the player data will be stored by the default LevelDB
  # player provider if it is enabled.
  Folder = "players"

[Resources]
  # AutoBuildPack is if the server should automatically generate a resource pack for custom features.
  AutoBuildPack = true
  # Folder configures the directory used by the server to load resource packs.
  Folder = "resources"
  # Required configures whether the server will require players to have a resource pack to join.
  Required = false

[Whitelist]
  # Enabled controls if only players listed in the whitelist file are allowed to join.
  Enabled = false
  # Enforce kicks the players online who are neither on the whitelist nor operators when it is turned on
  # (/whitelist on) or reloaded (/whitelist reload).
  Enforce = false
  # File is the path to the whitelist file that stores player names.
  #
  # Supported formats:
  #   - .txt/.list/.enum: line-separated list, one player name per line. (Default: "white-list.txt")
  #   - .toml: legacy TOML format with a "players" array.
  File = "white-list.txt"
  # Reason is the message sent to players that are rejected by the whitelist.
  # If empty, a safe default is used.
  Reason = "§cServer is white-listed"

[Backup]
  # Enabled makes a backup every Interval. /backup makes one either way. A backup copies the world while the
  # server runs, without stopping it, with the admin lists, then checks the copy.
  Enabled = true
  # Folder holds the backups, relative to the working directory. It must not lie inside the world folder. Keep a
  # copy of it off this machine: a backup on the same disk does not survive the disk.
  Folder = "backups"
  # Format is how a backup is written: "folder", a copy of the world that opens as it is and shares the files
  # that did not change with the world and the other backups on the same disk, so that ten cost little more
  # than one (treat the backups as read-only: their files are those of the world); or "zip", a .mcworld archive
  # of the world, which the game imports, each as large as the world: use it with Folder on another disk.
  Format = "folder"
  # Interval is the time between scheduled backups, from the end of the last, such as "6h". The first is made
  # an interval after the server starts. "0s" schedules none.
  Interval = "6h"
  # Keep is how many backups are kept: the oldest are deleted after each backup.
  Keep = 10
  # MaxAge also deletes the backups older than it, but the newest, such as "720h". "0s" deletes none for its
  # age.
  MaxAge = "0s"
  # MinFreeSpace refuses a backup that would leave less free space than this on the disk of Folder, such as
  # "512MiB" or "1GiB".
  MinFreeSpace = "1GiB"
  # SaveFirst saves the worlds and the players before each backup, so that it holds them as of that moment.
  SaveFirst = true
  # Verify is how each backup is checked before it counts: "record" opens it and reads its last save, "full"
  # also reads every key of the world (as long as reading the whole world), "off" does not check.
  Verify = "record"

[Permissions]
  # BroadcastConsoleToOps and BroadcastRemoteToOps show the feedback of console and remote admin commands to
  # operators in the game, as "[Console: ...]", with the game rule log_admin_commands on.
  BroadcastConsoleToOps = true
  BroadcastRemoteToOps = true
  # The levels of players and commands, as Java Edition numbers them: 0 anyone (help, list, msg, me), 1 moderator,
  # 2 game master (give, tp, gamemode, command blocks), 3 admin (ban, kick, op, whitelist), 4 owner (stop, save-all).
  # CommandBlockLevel is the level command blocks run commands at.
  CommandBlockLevel = 2
  # DefaultLevel is the level of players who are not operators.
  DefaultLevel = 0
  # DefaultRole is what players who are neither operators nor in permissions.json may do: "member", or
  # "visitor", who can walk and look around but not build, mine, open containers, use doors or attack. The roles
  # of players are in permissions.json, beside ops.json, in the format of Bedrock Dedicated Server.
  DefaultRole = "member"
  # OperatorLevel is the level /op gives, and that of operators with no level of their own in ops.json.
  OperatorLevel = 4
  # RoleLevel is the level an operator needs to change the roles of players from the game's player list.
  RoleLevel = 3

  # Commands sets the level a command needs, by its name or an alias, such as kick = 2 or version = 0.
  [Permissions.Commands]

[Bans]
  # The texts a banned player is refused at login and kicked with: Message for a ban of the player, IPMessage for
  # a ban of its address, then ReasonMessage if the ban has a reason (or DefaultReason is set), then ExpiresMessage
  # if it expires. Each may hold {reason}, {source}, {created} and {expires}; "\n" starts a line. These are Java
  # Edition's texts; the server's own before were one line, Message = IPMessage = "You are banned from this
  # server.", ReasonMessage = " Reason: {reason}" and DefaultReason = "".
  DefaultReason = "Banned by an operator."
  ExpiresMessage = "\nYour ban will be removed on {expires}"
  IPMessage = "Your IP address is banned from this server."
  # IPv6Prefix is how many leading bits of an IPv6 address a ban of it covers: 64 bans the network of one
  # subscriber, who changes the rest at will; 128 the address alone. /ban-ip also takes a network, such as
  # 203.0.113.0/24, or a player online. A loopback address, as of a proxy on the host, is banned only by a ban
  # of it alone, never by a network.
  IPv6Prefix = 64
  # MaxDuration caps how long a ban for a time lasts, such as "30d" or "720h"; "0s" sets no cap.
  MaxDuration = "0s"
  Message = "You are banned from this server."
  ReasonMessage = "\nReason: {reason}"
  # TimeFormat writes {created} and {expires}, as a layout of Go's package time, in the server's time zone.
  TimeFormat = "2006-01-02 at 15:04:05 MST"

[Audit]
  # Enabled writes audit.log: who ran which admin command, changed a list or made a backup, when and where, with
  # the result. Records are JSON Lines; the file is made with mode 0600.
  Enabled = true
  # File is the audit log; a relative path is beside ops.json.
  File = "audit.log"
  # Keep is how many rotated audit files are kept.
  Keep = 10
  # MaxSize rotates the file at this size, such as "64MiB", "1GiB" or "0" for never.
  MaxSize = "64MiB"
  # MinLevel records the commands that need this level or more (0 records every command), denied attempts
  # included. Remote requests are recorded at any level.
  MinLevel = 2
  # RecordAddresses records the IP address of players and remote clients.
  RecordAddresses = true

[AntiCheat]
  # Enabled switches the anti-cheat on or off: the checks the game runs on what the clients of players ask.
  # Each check has a table of its own, [AntiCheat.<Check>], with the keys Enabled, Action ("log", "setback" for
  # the movement checks, "cancel" for the others, "throttle" for Timer, or "kick"), ActAt and KickAt (the
  # violation levels it acts and kicks at; KickAt 0 never kicks), KickMessage, Decay (the level lost each second)
  # and ExemptGameModes, and settings of its own. A table, or a key, left out keeps its default; the default
  # config.toml lists them all, and docs/anticheat.md says what each means.
  Enabled = true
  # ExemptOperators has operators skip every check.
  ExemptOperators = false
  # ExemptPlayers are players who skip every check: names, or XUIDs written "xuid:<XUID>".
  ExemptPlayers = []

  # Speed only logs by default, as Bedrock's physics is not Java's. To put back players faster than Java's
  # physics allows, after two violations in quick succession:
  # [AntiCheat.Speed]
  #   Action = "setback"
  #   ActAt = 2.0

[Log]
  # Format is how logs are written to stderr: "text", the lines the server always wrote, or "json", one object
  # per line with a "component" field. Chat stays on stdout as text.
  Format = "text"
  # RateLimit caps the log lines each component writes a second, in bursts of ten times as many: the lines past
  # it are dropped, counted and summed up in a line at most every 10 seconds. 0 turns the cap off.
  RateLimit = 100
  # Levels sets the log level of each component of the server: "debug", "info", "warn" or "error". An empty
  # value uses LogLevel of [Server].
  [Log.Levels]
    AntiCheat = ""
    Commands = ""
    Generator = ""
    Network = ""
    Player = ""
    Save = ""
    Server = ""
    Session = ""
    World = ""

[Monitoring]
  # Address serves metrics, health and profiles over HTTP, as host:port. "" serves nothing. Keep it on localhost,
  # or set Token: the profiles are refused on another address without one.
  Address = "localhost:6060"
  # Health serves /livez, /readyz and /healthz, which never need the Token.
  Health = true
  # LiveTimeout is how long a tick of a world may take before /livez fails. Keep it above a minute, when the
  # stacks of a stuck tick are logged.
  LiveTimeout = "2m"
  # Metrics serves /metrics in the text format of Prometheus.
  Metrics = true
  # Pprof serves the Go profiles under /debug/pprof/.
  Pprof = true
  # ReadyTickAge is how long ago the last tick of a world may have ended for /readyz to pass.
  ReadyTickAge = "5s"
  # Token, if set, is the bearer token /metrics and /debug/pprof/ need: "Authorization: Bearer <Token>".
  Token = ""
