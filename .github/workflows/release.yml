name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (for manual dry runs, leave empty to skip publishing)"
        required: false
        type: string

permissions:
  contents: write

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: windows
            goarch: amd64
            ext: ".exe"
            archive: zip
          - goos: darwin
            goarch: arm64
            ext: ""
            archive: tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build & package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          version="${GITHUB_REF_NAME}"
          stage="adamant-${version}-${GOOS}-${GOARCH}"
          mkdir -p "dist/${stage}"
          go build -trimpath -ldflags="-s -w" -o "dist/${stage}/adamant${EXT}" .
          cp LICENSE README.md config.toml "dist/${stage}/"
          if [ "${ARCHIVE}" = "zip" ]; then
            (cd dist && zip -rq "${stage}.zip" "${stage}")
          else
            tar -C dist -czf "dist/${stage}.tar.gz" "${stage}"
          fi
          rm -rf "dist/${stage}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums & GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          sha256sum adamant-* > checksums.txt
          gh release create "${GITHUB_REF_NAME}" adamant-* checksums.txt \
            --title "Adamant ${GITHUB_REF_NAME}" \
            --generate-notes
