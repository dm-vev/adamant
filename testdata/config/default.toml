[Audit]
  Enabled = true
  File = "audit.log"
  Keep = 10
  MaxSize = "64MiB"
  MinLevel = 2
  RecordAddresses = true

[Backup]
  Enabled = true
  Folder = "backups"
  Format = "folder"
  Interval = "6h"
  Keep = 10
  MaxAge = "0s"
  MinFreeSpace = "1GiB"
  SaveFirst = true
  Verify = "record"

[Bans]
  DefaultReason = ""
  ExpiresMessage = "\nYour ban will be removed on {expires}"
  IPMessage = "You are banned from this server."
  MaxDuration = "0s"
  Message = "You are banned from this server."
  ReasonMessage = " Reason: {reason}"
  TimeFormat = "2006-01-02 at 15:04:05 MST"

[Java]
  Address = ""
  Message = ""

[Log]
  Format = "text"
  RateLimit = 100

  [Log.Levels]
    AntiCheat = ""
    Commands = ""
    Generator = ""
    Network = ""
    Player = ""
    Save = ""
    Server = ""
    Session = ""
    World = ""

[Monitoring]
  Address = "localhost:6060"
  Health = true
  LiveTimeout = "2m"
  Metrics = true
  Pprof = true
  ReadyTickAge = "5s"
  Token = ""

[Network]
  ACMECacheDir = ""
  ACMEChallengeAddress = ""
  ACMEDirectory = ""
  ACMEEmail = ""
  Address = ":19132"
  EnableQuery = false
  HTTPSDomain = ""
  IdentityFile = "server-key.pem"
  LAN = false
  MaxConnectionsPerIP = 8
  MaxPendingConnections = 256
  MaxPendingConnectionsPerIP = 4
  MaxPendingConnectionsPerNetwork = 32
  MaxPendingLogins = 64
  PrimaryProtocol = "1.26.50"
  Protocols = ["1.26.50"]
  QueryPlugins = false
  Transport = "nethernet"

[Permissions]
  BroadcastConsoleToOps = true
  BroadcastRemoteToOps = true
  CommandBlockLevel = 2
  DefaultLevel = 0
  DefaultRole = "member"
  OperatorLevel = 4
  RoleLevel = 3

  [Permissions.Commands]

[Players]
  Folder = "players"
  MaxCount = 0
  MaximumChunkRadius = 32
  SaveData = true

[Proxy]
  Address = ""
  Secret = ""

[Resources]
  AutoBuildPack = true
  Folder = "resources"
  Required = false

[Server]
  AuthEnabled = true
  DisableJoinQuitMessages = false
  IdentityKey = "auto"
  LogLevel = "info"
  MuteEmoteChat = false
  Name = "Dragonfly Server"
  NameCheck = "lenient"
  ReconnectPolicy = "kick-existing"
  SpawnTimeout = "1m"
  SpawnTimeoutMessage = "Timed out while joining the game."
  StrictConfig = false

[Whitelist]
  Enabled = false
  File = "white-list.txt"
  Reason = "§cServer is white-listed"

[World]
  DefaultDimension = "overworld"
  DisableEnd = false
  DisableNether = false
  DisableOverworld = false
  Folder = "world"
  GeneratorProfile = "auto"
  GeneratorQueueSize = 0
  GeneratorWorkers = 0
  PortalDisabledMessage = "The %s dimension is disabled on this server."
  Regions = false
  SaveChunks = "modified"
  SaveData = true
  SaveInterval = "5m"
  Seed = 0

[Xbox]
  AcceptFriends = true
  Enabled = false
  LegacySignaling = false
  TokenFile = "xbox-token.json"
